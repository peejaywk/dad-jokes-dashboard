services:
  backend:
    image: ghcr.io/peejaywk/dad-jokes-api:0.3.0
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 5s

  web:
    image: ghcr.io/peejaywk/dad-jokes-web:0.3.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 5s

  cloudflaretunnel:
    image: cloudflare/cloudflared:2026.11.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - TUNNEL_METRICS=127.0.0.1:20241 # Metrics only inside the container
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 5s
    depends_on:
      web:
        condition: service_healthy
