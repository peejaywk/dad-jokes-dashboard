services:
  backend:
    build: ./src/backend
    image: dad-jokes-backend:dev
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 5s

  web:
    build: ./src/frontend
    image: dad-jokes-frontend:dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 5s

  cloudflaretunnel:
    image: cloudflare/cloudflared:2026.11.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
