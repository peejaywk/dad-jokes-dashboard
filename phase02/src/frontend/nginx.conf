 server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;

      server_tokens off;                       # hide the nginx version

      # Real client IP: trust the header only from the Docker network (cloudflared)
      set_real_ip_from 172.16.0.0/12;
      set_real_ip_from 192.168.0.0/16;
      real_ip_header CF-Connecting-IP;

      # Security headers ("always" = on error pages too)
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

      location / {
          try_files $uri $uri/ =404;
      }

      # Trailing slash strips /api:  /api/joke -> http://backend:8080/joke
      location /api/ {
          proxy_pass http://backend:8080/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }
  }
