services:
  updater:
    build:
      context: .
      dockerfile: Dockerfile.updater
    volumes:
      - html:/html
    restart: unless-stopped

  web:
    image: nginx/nginx-unprivileged:alpine
    ports:
      - "8080:8080"
    volumes:
      - type: volume
        source: html
        target: /usr/share/nginx/html
        read_only: true
        volume:
          nocopy: true
    depends_on:
      - updater
    restart: unless-stopped

volumes:
  html:
